<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>سیاره‌خور آنلاین</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:#000; color:#fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action:none; user-select:none; }
  #app { position:relative; width:100vw; height:100vh; }
  .screen { position:absolute; inset:0; bottom:64px; display:flex; flex-direction:column; align-items:center;
    padding:16px; overflow-y:auto; background:#000; }
  .screen.hidden { display:none; }
  .screen.full { bottom:0; padding:0; }

  h1.title { font-size:24px; font-weight:800; margin:6px 0; text-align:center;
    background:linear-gradient(90deg,#4fa8ff,#ff5cf0); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .subtitle { color:#8a99ad; font-size:13px; margin-bottom:16px; text-align:center; }

  .status-badge { font-size:12px; padding:4px 10px; border-radius:12px; background:#111; border:1px solid #333; margin-bottom:10px; }

  button.btn { background:linear-gradient(135deg,#4fa8ff,#3d7fc9); color:#fff; border:none; border-radius:14px;
    padding:14px 20px; font-size:16px; font-weight:700; width:100%; max-width:380px; box-shadow:0 6px 16px rgba(79,168,255,.3); cursor:pointer; }
  button.btn:active { transform:scale(.97); }

  #bottomnav { position:absolute; left:0; right:0; bottom:0; height:64px; display:flex;
    background:#0a0d12; border-top:1px solid #1c2530; z-index:20; }
  .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    color:#5c6b7d; font-size:10px; cursor:pointer; }
  .nav-btn.active { color:#4fa8ff; }

  /* HUD & Leaderboard */
  #hud { position:absolute; top:14px; left:14px; right:14px; display:flex; justify-content:space-between; align-items:flex-start;
    font-size:13px; color:#cfe0f2; pointer-events:none; z-index:5; }
  
  #leaderboard { background:rgba(18,22,31,0.85); border:1px solid rgba(255,255,255,0.15); border-radius:12px;
    padding:8px 12px; font-size:12px; backdrop-filter:blur(4px); display:flex; flex-direction:column; gap:4px; min-width:150px; }
  .lb-title { font-size:11px; font-weight:800; color:#ffd766; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:3px; text-align:center; }
  .lb-item { display:flex; justify-content:space-between; gap:8px; font-weight:600; }
  .lb-item.me { color:#7ee787; }

  #back-btn { position:absolute; top:12px; left:12px; z-index:8; background:rgba(255,255,255,.1); border:none;
    color:#fff; border-radius:10px; padding:6px 10px; font-size:13px; cursor:pointer; }
  #joystick-base { position:absolute; width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,0.06); border:2px solid rgba(255,255,255,0.15); display:none; z-index:6; }
  #joystick-knob { position:absolute; width:52px; height:52px; border-radius:50%;
    background:rgba(79,168,255,0.55); border:2px solid rgba(255,255,255,0.4); display:none; z-index:7; }
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="screen" id="screen-home">
    <h1 class="title">🪐 سیاره‌خور آنلاین</h1>
    <p class="subtitle">تست آنلاین مولتی‌پلییر واقعی</p>
    <div class="status-badge" id="net-status">🔄 در حال اتصال به سرور...</div>

    <div style="margin: 20px 0; text-align:center;">
      <input type="text" id="username-input" placeholder="اسم خودت رو بنویس" style="padding:10px; border-radius:8px; border:1px solid #333; background:#111; color:#fff; text-align:center; font-weight:bold;">
    </div>

    <button class="btn" id="play-btn">▶ ورود به مپ آنلاین</button>
  </div>

  <!-- BOTTOM NAV -->
  <div id="bottomnav">
    <div class="nav-btn active"><span style="font-size:18px;">🏠</span>خانه</div>
  </div>

  <!-- GAME -->
  <div class="screen hidden full" id="screen-game">
    <canvas id="board"></canvas>
    <button id="back-btn">✕ خروج</button>
    <div id="hud">
      <div>حجم: <b id="hud-mass" style="color:#4fa8ff;">0</b></div>
      <div id="leaderboard">
        <div class="lb-title">🏆 آنلاین‌ها (<span id="online-count">0</span>)</div>
        <div id="lb-list"></div>
      </div>
    </div>
    <div id="joystick-base"></div>
    <div id="joystick-knob"></div>
  </div>

</div>

<script>
(function () {
  /* Firebase Init */
  const firebaseConfig = {
    apiKey: "AIzaSyDfvJCZQX8u6fzPRpBIh1BY0zHS6fx27Ro",
    authDomain: "planet-2fdf2.firebaseapp.com",
    databaseURL: "https://planet-2fdf2-default-rtdb.firebaseio.com",
    projectId: "planet-2fdf2",
    storageBucket: "planet-2fdf2.firebasestorage.app",
    messagingSenderId: "237872686307",
    appId: "1:237872686307:web:9c670a134208bacbd651d6"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const myUid = 'user_' + Math.random().toString(36).substring(2, 9);
  let myName = 'بازیکن_' + Math.floor(Math.random()*899 + 100);
  document.getElementById('username-input').value = myName;

  const statusEl = document.getElementById('net-status');
  
  // Connection listener
  db.ref('.info/connected').on('value', snap => {
    if (snap.val() === true) {
      statusEl.style.color = '#7ee787';
      statusEl.textContent = '🟢 متصل به سرور آنلاین';
    } else {
      statusEl.style.color = '#ff5c5c';
      statusEl.textContent = '🔴 قطع اتصال (فیلتر یا اینترنت)';
    }
  });

  /* Game Core */
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const WORLD = 2000;
  
  let running = false;
  let myPlayer = { x: 500 + Math.random()*500, y: 500 + Math.random()*500, mass: 30, color: '#4fa8ff' };
  let remotePlayers = {};
  let pellets = [];
  let myRef = null;

  function fitCanvas(){ 
    canvas.width = window.innerWidth; 
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', fitCanvas);

  function radiusFromMass(m){ return 8 + Math.sqrt(m) * 3.5; }

  // Generate Fixed Pellets (Deterministic)
  for(let i=0; i<150; i++){
    pellets.push({
      x: (i * 137) % WORLD,
      y: (i * 243) % WORLD,
      color: `hsl(${(i * 50) % 360}, 70%, 60%)`
    });
  }

  document.getElementById('play-btn').addEventListener('click', startGame);
  document.getElementById('back-btn').addEventListener('click', stopGame);

  function startGame(){
    fitCanvas();
    myName = document.getElementById('username-input').value || myName;
    myPlayer.color = `hsl(${Math.floor(Math.random()*360)}, 80%, 60%)`;
    
    // Joint online room
    myRef = db.ref('live_room/' + myUid);
    myRef.set({
      name: myName,
      x: myPlayer.x,
      y: myPlayer.y,
      mass: myPlayer.mass,
      color: myPlayer.color
    });

    myRef.onDisconnect().remove();

    // Sync other players
    db.ref('live_room').on('value', snap => {
      const data = snap.val() || {};
      delete data[myUid];
      remotePlayers = data;
    });

    running = true;
    document.getElementById('screen-home').classList.add('hidden');
    document.getElementById('screen-game').classList.remove('hidden');
    document.getElementById('bottomnav').style.display = 'none';
    
    requestAnimationFrame(loop);
  }

  function stopGame(){
    running = false;
    if(myRef) myRef.remove();
    db.ref('live_room').off();
    document.getElementById('screen-game').classList.add('hidden');
    document.getElementById('screen-home').classList.remove('hidden');
    document.getElementById('bottomnav').style.display = 'flex';
  }

  /* JoyStick Controls */
  let joy = { active: false, dx: 0, dy: 0, originX: 0, originY: 0 };
  const joyBase = document.getElementById('joystick-base'), joyKnob = document.getElementById('joystick-knob');

  window.addEventListener('touchstart', e => {
    if(!running) return;
    const t = e.touches[0];
    joy.active = true; joy.originX = t.clientX; joy.originY = t.clientY;
    joyBase.style.display = 'block'; joyKnob.style.display = 'block';
    joyBase.style.left = (t.clientX - 60) + 'px'; joyBase.style.top = (t.clientY - 60) + 'px';
    joyKnob.style.left = (t.clientX - 26) + 'px'; joyKnob.style.top = (t.clientY - 26) + 'px';
  });

  window.addEventListener('touchmove', e => {
    if (!joy.active) return;
    const t = e.touches[0];
    let dx = t.clientX - joy.originX, dy = t.clientY - joy.originY;
    const d = Math.hypot(dx, dy);
    if (d > 50) { dx = dx / d * 50; dy = dy / d * 50; }
    joy.dx = dx / 50; joy.dy = dy / 50;
    joyKnob.style.left = (joy.originX + dx - 26) + 'px';
    joyKnob.style.top = (joy.originY + dy - 26) + 'px';
  });

  window.addEventListener('touchend', () => {
    joy.active = false; joy.dx = 0; joy.dy = 0;
    joyBase.style.display = 'none'; joyKnob.style.display = 'none';
  });

  // Loop & Sync
  let lastSync = 0;
  function loop(time){
    if(!running) return;

    // Move player
    const speed = Math.max(1.5, 5 - radiusFromMass(myPlayer.mass)*0.05);
    myPlayer.x = Math.max(20, Math.min(WORLD - 20, myPlayer.x + joy.dx * speed * 3));
    myPlayer.y = Math.max(20, Math.min(WORLD - 20, myPlayer.y + joy.dy * speed * 3));

    // Eat pellets
    const r = radiusFromMass(myPlayer.mass);
    pellets.forEach(p => {
      if(Math.hypot(p.x - myPlayer.x, p.y - myPlayer.y) < r){
        myPlayer.mass += 0.2;
      }
    });

    // Send position to server every 50ms
    if(time - lastSync > 50){
      if(myRef) myRef.update({ x: Math.round(myPlayer.x), y: Math.round(myPlayer.y), mass: Math.round(myPlayer.mass) });
      lastSync = time;
    }

    // Render
    render();
    updateUI();
    requestAnimationFrame(loop);
  }

  function render(){
    ctx.fillStyle = '#080c14';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Camera follow player
    const camX = canvas.width/2 - myPlayer.x;
    const camY = canvas.height/2 - myPlayer.y;

    ctx.save();
    ctx.translate(camX, camY);

    // Map Border
    ctx.strokeStyle = '#334466';
    ctx.lineWidth = 4;
    ctx.strokeRect(0, 0, WORLD, WORLD);

    // Draw Pellets
    pellets.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
      ctx.fill();
    });

    // Draw Remote Players
    Object.keys(remotePlayers).forEach(id => {
      const p = remotePlayers[id];
      const pr = radiusFromMass(p.mass || 30);
      ctx.fillStyle = p.color || '#ff5c5c';
      ctx.beginPath();
      ctx.arc(p.x, p.y, pr, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(p.name || 'حریف', p.x, p.y - pr - 5);
    });

    // Draw Me
    const myR = radiusFromMass(myPlayer.mass);
    ctx.fillStyle = myPlayer.color;
    ctx.beginPath();
    ctx.arc(myPlayer.x, myPlayer.y, myR, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(myName, myPlayer.x, myPlayer.y - myR - 5);

    ctx.restore();
  }

  function updateUI(){
    document.getElementById('hud-mass').textContent = Math.round(myPlayer.mass);

    const list = [{ name: myName + ' (شما)', mass: Math.round(myPlayer.mass), me: true }];
    Object.keys(remotePlayers).forEach(id => {
      const p = remotePlayers[id];
      list.push({ name: p.name || 'حریف', mass: Math.round(p.mass || 30), me: false });
    });

    list.sort((a,b) => b.mass - a.mass);
    document.getElementById('online-count').textContent = list.length;

    const lbContainer = document.getElementById('lb-list');
    lbContainer.innerHTML = '';
    list.forEach(item => {
      const row = document.createElement('div');
      row.className = 'lb-item' + (item.me ? ' me' : '');
      row.innerHTML = `<span>${item.name}</span><span>${item.mass}</span>`;
      lbContainer.appendChild(row);
    });
  }

})();
</script>
</body>
</html>
